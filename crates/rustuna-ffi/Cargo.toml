[package]
name = "rustuna-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustuna_ffi"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "generate_traces"
path = "src/bin/generate_traces.rs"

[[bin]]
name = "rust_bench"
path = "src/bin/rust_bench.rs"

[dependencies]
rustuna_core = { path = "../../ref/rustuna/rustuna_core" }
rustuna_importance = { path = "../../ref/rustuna/rustuna_importance" }
rustuna_sampler = { path = "../../ref/rustuna/rustuna_sampler" }
rustuna_storage = { path = "../../ref/rustuna/rustuna_storage" }
rand = "0.8.5"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
