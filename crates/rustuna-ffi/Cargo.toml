[package]
name = "rustuna-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustuna_ffi"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "generate_traces"
path = "src/bin/generate_traces.rs"

[[bin]]
name = "rust_bench"
path = "src/bin/rust_bench.rs"

[dependencies]
rustuna_core = { path = "../../ref/rustuna/rustuna_core" }
rustuna_importance = { path = "../../ref/rustuna/rustuna_importance" }
rustuna_sampler = { path = "../../ref/rustuna/rustuna_sampler", features = ["qmc"] }
rustuna_storage = { path = "../../ref/rustuna/rustuna_storage" }
rand = "0.8.5"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.6"

[profile.release]
opt-level = 3
codegen-units = 1
strip = "debuginfo"
debug = false
# lto intentionally off — conflicts with embed-bitcode=no and bloats staticlib 24M→57M; Swift dead_strip handles GC
