# .github/workflows/deploy-pages.yml
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "Sources/Swiftuna/**"
      - ".github/workflows/deploy-pages.yml"
      - "Package.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libsqlite3-dev

      - name: Cache SwiftPM dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-swiftpm-

      - name: Checkout DocC web renderer
        run: |
          rm -rf /tmp/docc-render
          git clone --depth 1 https://github.com/apple/swift-docc-render-artifact.git /tmp/docc-render

      - name: Generate DocC documentation
        env:
          DOCC_HTML_DIR: /tmp/docc-render
        run: |
          rm -rf ./docs
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target Swiftuna \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}"

      - name: Configure Pages routing & root redirect
        run: |
          # 1. Prevent GitHub Pages from running Jekyll
          touch ./docs/.nojekyll

          # 2. Add SPA 404 fallback for direct URL routing
          cp ./docs/index.html ./docs/404.html

          # 3. Add client-side redirect at root
          cat << 'EOF' > ./docs/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Redirecting to Swiftuna Documentation...</title>
            <meta http-equiv="refresh" content="0; url=/swiftuna/documentation/swiftuna">
            <script>
              window.location.replace("/swiftuna/documentation/swiftuna");
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="/swiftuna/documentation/swiftuna">Swiftuna Documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Verify asset output
        run: |
          ls -lh ./docs/js/
          test -f ./docs/js/chunk-vendors.*.js || test -f ./docs/js/*.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
